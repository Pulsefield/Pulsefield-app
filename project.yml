name: Pulsefield

options:
  minimumXcodeGenVersion: 2.45.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    PRODUCT_NAME: $(TARGET_NAME)
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

fileGroups:
  - README.md
  - AGENTS.md
  - LICENSE
  - docs

targets:
  PulsefieldiOS:
    type: application
    supportedDestinations:
      - iOS
    sources:
      - path: Apps/PulsefieldiOS
    dependencies:
      - target: PulsefieldCore
      - target: PulsefieldUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.pulsefield.ios
        INFOPLIST_KEY_CFBundleDisplayName: Pulsefield
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Pulsefield uses the microphone to prototype nearby music recognition flows.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO

  PulsefieldMac:
    type: application
    supportedDestinations:
      - macOS
    sources:
      - path: Apps/PulsefieldMac
    dependencies:
      - target: PulsefieldCore
      - target: PulsefieldUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.pulsefield.mac
        INFOPLIST_KEY_CFBundleDisplayName: Pulsefield
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Pulsefield uses the microphone to prototype nearby music recognition flows.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO

  PulsefieldCore:
    type: framework
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: Sources/PulsefieldCore
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.pulsefield.core
        DEFINES_MODULE: YES

  PulsefieldUI:
    type: framework
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: Sources/PulsefieldUI
    dependencies:
      - target: PulsefieldCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.pulsefield.ui
        DEFINES_MODULE: YES

  PulsefieldCoreTests:
    type: bundle.unit-test
    supportedDestinations:
      - macOS
    sources:
      - path: Tests/PulsefieldCoreTests
    dependencies:
      - target: PulsefieldCore
      - target: PulsefieldUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.pulsefield.core.tests

schemes:
  PulsefieldiOS:
    build:
      targets:
        PulsefieldiOS: all
        PulsefieldUI: all
        PulsefieldCore: all

  PulsefieldMac:
    build:
      targets:
        PulsefieldMac: all
        PulsefieldUI: all
        PulsefieldCore: all
    test:
      targets:
        - name: PulsefieldCoreTests
